[project]
name = "liki"
version = "0.1.0"
description = "Evidence-governed quantitative research office; real execution prohibited"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135,<1",
  "uvicorn>=0.41,<1",
  "pydantic>=2.12,<3",
  "psycopg[binary]>=3.3,<4",
  "httpx>=0.28,<1",
  "jsonschema>=4.26,<5",
  "numpy>=2.4,<3",
  "scipy>=1.17,<2",
  "cryptography>=46,<50",
]

[dependency-groups]
dev = ["pytest>=9,<10", "hypothesis>=6.151,<7", "ruff>=0.15,<1", "mypy>=1.19,<2", "pip-audit>=2.10,<3"]

[build-system]
requires = ["hatchling>=1.29,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["liki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "S307"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

